services:
  backend:
    container_name: qait-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - QUEUE_PREFIX=${QUEUE_PREFIX:-qait-prod}
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    container_name: qait-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "-r", "tsconfig-paths/register", "dist/worker/index.js"]
    env_file:
      - .env
    environment:
      - QUEUE_PREFIX=${QUEUE_PREFIX:-qait-prod}
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
