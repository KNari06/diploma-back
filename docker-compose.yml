services:
  backend:
    container_name: qait-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  worker:
    container_name: qait-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "-r", "tsconfig-paths/register", "dist/worker/index.js"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
