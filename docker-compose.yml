services:
  backend:
    container_name: qait-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Mount logs directory to persist error.log
      # Docker will create the directory if it doesn't exist
      # If you have permission issues, ensure ./logs exists and is writable on host
      - ./logs:/app/logs
    restart: always

  worker:
    container_name: qait-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "-r", "tsconfig-paths/register", "dist/worker/index.js"]
    env_file:
      - .env
    volumes:
      # Mount logs directory to persist error.log
      # Docker will create the directory if it doesn't exist
      # If you have permission issues, ensure ./logs exists and is writable on host
      - ./logs:/app/logs
    restart: always
