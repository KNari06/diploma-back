<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FEATURE_NAME}} - Features Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="../../assets/styles.css">
    <style>
        .feature-page {
            padding: 40px;
        }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .overview {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .overview p {
            line-height: 1.8;
            color: #666;
            margin-bottom: 15px;
        }

        .diagram-container {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            overflow-x: auto;
        }

        .mermaid {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .method-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .method-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .method-card.new {
            border-color: #4caf50;
            background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
        }

        .method-card.enhanced {
            border-color: #f44336;
            background: linear-gradient(135deg, #ffebee 0%, #ffffff 100%);
        }

        .method-card.refactored {
            border-color: #ff9800;
            background: linear-gradient(135deg, #fff4e1 0%, #ffffff 100%);
        }

        .method-card.unchanged {
            border-color: #2196f3;
            background: linear-gradient(135deg, #e1f5ff 0%, #ffffff 100%);
        }

        .method-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .method-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .method-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-new {
            background: #4caf50;
            color: white;
        }

        .badge-enhanced {
            background: #f44336;
            color: white;
        }

        .badge-refactored {
            background: #ff9800;
            color: white;
        }

        .badge-unchanged {
            background: #2196f3;
            color: white;
        }

        .method-description {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .changelog-entry {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .changelog-date {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .changelog-commit {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 10px;
        }

        .change-item {
            margin-bottom: 10px;
        }

        .change-details {
            margin-top: 5px;
            padding-left: 15px;
            color: #666;
            font-size: 0.9em;
        }

        .code-references {
            list-style: none;
            padding: 0;
        }

        .code-reference {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .code-reference a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .code-reference a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{FEATURE_NAME}}</h1>
            <p>{{FEATURE_DESCRIPTION}}</p>
        </div>

        <div class="feature-page">
            <a href="../../index.html" class="back-link">← Back to Features</a>

            <div class="section">
                <h2 class="section-title">📋 Overview</h2>
                <div class="overview" id="overview">
                    <!-- Overview content will be loaded from JSON -->
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">📊 Flow Diagram</h2>
                <div class="diagram-container">
                    <div id="flowDiagram" class="mermaid">
                        <!-- Mermaid diagram will be loaded here -->
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">🔍 Methods</h2>
                <div class="filters">
                    <button class="filter-btn active" onclick="filterMethods('all')">All</button>
                    <button class="filter-btn" onclick="filterMethods('new')">New</button>
                    <button class="filter-btn" onclick="filterMethods('enhanced')">Enhanced</button>
                    <button class="filter-btn" onclick="filterMethods('refactored')">Refactored</button>
                    <button class="filter-btn" onclick="filterMethods('unchanged')">Unchanged</button>
                </div>
                <input type="text" class="search-box" id="methodSearchBox" placeholder="🔍 Search methods..." onkeyup="searchMethods()">
                <div class="methods-grid" id="methodsGrid">
                    <!-- Methods will be loaded from methods.json -->
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">📝 Changelog</h2>
                <div id="changelog">
                    <!-- Changelog will be loaded from changelog.json -->
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">📚 Code References</h2>
                <ul class="code-references" id="codeReferences">
                    <!-- Code references will be loaded from methods.json -->
                </ul>
            </div>
        </div>
    </div>

    <script src="../../assets/components.js"></script>
    <script>
        // Load feature data
        async function loadFeatureData() {
            const featureId = window.location.pathname.split('/').slice(-2, -1)[0];

            try {
                // Load methods
                const methodsResponse = await fetch(`methods.json`);
                if (!methodsResponse.ok) throw new Error('Failed to load methods.json');
                const methods = await methodsResponse.json();
                if (typeof renderMethodsList === 'function') {
                    renderMethodsList(Object.values(methods), 'methodsGrid');
                } else {
                    console.warn('renderMethodsList not available');
                }

                // Load changelog
                const changelogResponse = await fetch(`changelog.json`);
                if (!changelogResponse.ok) throw new Error('Failed to load changelog.json');
                const changelog = await changelogResponse.json();
                if (typeof renderChangelog === 'function') {
                    renderChangelog(changelog.entries || [], 'changelog');
                } else {
                    console.warn('renderChangelog not available');
                }

                // Load flow diagram
                const diagramResponse = await fetch(`flow-diagram.md`);
                if (!diagramResponse.ok) throw new Error('Failed to load flow-diagram.md');
                const diagramCode = await diagramResponse.text();
                if (typeof renderMermaidDiagram === 'function') {
                    renderMermaidDiagram(diagramCode, 'flowDiagram');
                } else {
                    // Fallback: render directly
                    const container = document.getElementById('flowDiagram');
                    if (container) {
                        container.textContent = diagramCode;
                        mermaid.init(undefined, container);
                    }
                }

                // Load overview
                const overviewResponse = await fetch(`overview.json`);
                const overview = await overviewResponse.json();
                document.getElementById('overview').innerHTML = `<p>${overview.description}</p>`;

                // Load code references
                const codeRefs = Object.values(methods)
                    .filter(m => m.file)
                    .map(m => ({
                        file: m.file,
                        line: m.line,
                        method: m.name
                    }));

                document.getElementById('codeReferences').innerHTML = codeRefs.map(ref => {
                    // Fix path: from docs/features/features/<feature>/ to project root
                    const relativePath = ref.file.startsWith('src/') ? ref.file : `src/${ref.file}`;
                    return `
                    <li class="code-reference">
                        <a href="../../../../${relativePath}#L${ref.line}" target="_blank">
                            ${ref.file}:${ref.line} - ${ref.method}
                        </a>
                    </li>
                `;
                }).join('');

            } catch (error) {
                console.error('Error loading feature data:', error);
            }
        }

        loadFeatureData();
    </script>
</body>
</html>
