name: Deploy QAI Backend

on:
  push:
    branches:
      - main-04-11

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACByCxK0xU2MGZHuQEWXrVQofEEfTy4UgxIzs8n/7zNVegAAAMjD8QZkw/EG
            ZAAAAAtzc2gtZWQyNTUxOQAAACByCxK0xU2MGZHuQEWXrVQofEEfTy4UgxIzs8n/7zNVeg
            AAAED4afrqNEaigeQlZClDVnN6wCuaQrBTxhJRtw9dj0zC43ILErTFTYwZke5ARZetVCh8
            QR9PLhSDEjOzyf/vM1V6AAAAQHJvb3RAaW5zdGFuY2UtMS51cy1jZW50cmFsMS1jLmMuZm
            lyc3QtZm9vdGluZy00NzY3MTUtYzYuaW50ZXJuYWwBAgMEBQ==
            -----END OPENSSH PRIVATE KEY-----

      - name: Deploy to remote server
        run: |
          ssh -o StrictHostKeyChecking=no root@34.10.193.13 << 'EOF'
            set -e
            cd ~/QAI---BackEnd || exit 1

            echo "Updating repository..."
            git fetch origin main-04-11 && git reset --hard origin/main-04-11

            echo "Stopping containers and cleaning up..."
            docker compose down -v

            echo "Pruning Docker builder cache..."
            docker builder prune -f

            echo "Building and starting containers..."
            docker compose up -d --build

            echo "Deployment completed successfully."
          EOF
