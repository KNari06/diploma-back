<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor pipeline viz</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Cytoscape + dagre layout (CDN, no bundler) -->
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>editor pipeline</strong>
      <span class="subtitle">lint · apply · run</span>
    </div>
    <div class="controls">
      <div class="seg" id="seg-mode">
        <button data-mode="flow" class="active">flow</button>
        <button data-mode="blocks">blocks</button>
        <button data-mode="focus">focus</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="t-external" checked />
        <span>cross-service</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="t-internal" />
        <span>intra-service</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="t-ws" checked />
        <span>WS emits</span>
      </label>
      <input type="search" id="search" placeholder="search method…" />
      <button id="btn-fit">fit</button>
      <span id="status">loading…</span>
    </div>
  </header>

  <main>
    <section id="graph"></section>
    <aside id="side">
      <div id="side-empty" class="muted">click a node for details</div>
      <div id="side-content" hidden></div>
    </aside>
  </main>

  <footer class="legend">
    <span class="layer-chip" data-layer="ws-handler">ws-handler</span>
    <span class="layer-chip" data-layer="snapshot">snapshot</span>
    <span class="layer-chip" data-layer="dom-analysis">dom-analysis</span>
    <span class="layer-chip" data-layer="lint">lint</span>
    <span class="layer-chip" data-layer="locator-plan">locator-plan</span>
    <span class="layer-chip" data-layer="pruner">pruner</span>
    <span class="layer-chip" data-layer="resolver">resolver</span>
    <span class="layer-chip" data-layer="readiness">readiness</span>
    <span class="layer-chip" data-layer="wait">wait</span>
    <span class="layer-chip" data-layer="diagnosis">diagnosis</span>
    <span class="layer-chip" data-layer="trace">trace</span>
    <span class="layer-chip" data-layer="step-apply">step-apply</span>
    <span class="layer-chip" data-layer="run">run</span>
    <span class="layer-chip" data-layer="session">session</span>
    <span class="layer-chip" data-layer="recording">recording</span>
    <span class="spacer"></span>
    <span class="hint">click service to focus · runtime overlay: pulse = active call</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
