<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>App shell with embedded login iframe</title></head>
<body style="font-family: sans-serif; padding: 24px;">
  <h1>My App</h1>
  <p>Please sign in using the form below.</p>
  <!-- Same-origin iframe: served from the same local server, so the collector
       can traverse into it and the executor can frameLocator() back in. -->
  <iframe id="login-frame" name="loginFrame" src="/inner.html"
          style="width:420px;height:320px;border:1px solid #ccc;"></iframe>
</body>
</html>
