# ─────────────────────────────────────────────────────────────────
# QAI Backend — GitLab CI/CD (Azure) — self-hosted ARM runner
#
# Одна Docker image (amd64) → деплой двух Container Apps:
#   • qai-api-prod
#   • qai-worker-prod
# Образ в ACR; Container Apps тянут через Managed Identity.
#
# Раннер: dev-runner (Azure VM, ARM64, docker executor + host docker.sock).
# ВАЖНО: Container Apps бегут amd64, VM — arm64 → сборка идёт под qemu
# (binfmt amd64 должен быть установлен на VM). Медленно, но нативно деплоит.
#
# Required CI/CD Variables (Group: qait.dev):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   RESOURCE_GROUP=qai-prod-rg  ACR_NAME=qaiprodacr24d6d7
#   ACR_LOGIN_SERVER=qaiprodacr24d6d7.azurecr.io
#   CONTAINER_APP_API=qai-api-prod  CONTAINER_APP_WORKER=qai-worker-prod
# ─────────────────────────────────────────────────────────────────

default:
  tags:
    - dev-runner            # все джобы → наш self-hosted runner

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

variables:
  DOCKER_DEFAULT_PLATFORM: linux/amd64   # ARM-runner, но Container Apps = amd64
  DOCKER_BUILDKIT: "1"
  IMAGE: "${ACR_LOGIN_SERVER}/qai-backend:${CI_COMMIT_SHORT_SHA}"
  IMAGE_LATEST: "${ACR_LOGIN_SERVER}/qai-backend:latest"

stages:
  - build
  - deploy

# ─────────────────────────────────────────────────────────────────
# Azure OIDC Federated Identity (работает и на self-hosted runner)
# ─────────────────────────────────────────────────────────────────
.azure_auth: &azure_auth
  id_tokens:
    AZURE_TOKEN:
      aud: https://gitlab.com
  before_script:
    - |
      set -euo pipefail
      az login \
        --federated-token "$AZURE_TOKEN" \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --output none
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"

# ─────────────────────────────────────────────────────────────────
# Сборка образа (amd64 под qemu) и push в ACR — через host docker
# ─────────────────────────────────────────────────────────────────
build:
  stage: build
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *azure_auth
  script:
    - |
      set -euo pipefail

      echo "🐳 Installing Docker CLI"
      tdnf install -y moby-cli ca-certificates
      tdnf clean all

      echo "🔌 Using host Docker daemon via mounted socket"
      docker info >/dev/null

      echo "🔐 Login to ACR"
      az acr login --name "$ACR_NAME"

      echo "🔨 Building (linux/amd64): $IMAGE"
      docker pull "$IMAGE_LATEST" 2>/dev/null || true

      docker build \
        --platform linux/amd64 \
        --cache-from "$IMAGE_LATEST" \
        --tag "$IMAGE" \
        --tag "$IMAGE_LATEST" \
        .

      echo "⬆️ Pushing to ACR..."
      docker push "$IMAGE"
      docker push "$IMAGE_LATEST"

# ─────────────────────────────────────────────────────────────────
# Деплой API
# ─────────────────────────────────────────────────────────────────
deploy:api:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying API → $CONTAINER_APP_API"
      az containerapp update \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none
      URL=$(az containerapp show \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --query "properties.configuration.ingress.fqdn" -o tsv)
      echo "✅ API deployed → https://$URL"
  environment:
    name: production/api
    url: https://api.qait.dev

# ─────────────────────────────────────────────────────────────────
# Деплой Worker (command/args заданы в Terraform — CI меняет только image)
# ─────────────────────────────────────────────────────────────────
deploy:worker:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying Worker → $CONTAINER_APP_WORKER"
      az containerapp update \
        --name "$CONTAINER_APP_WORKER" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none
      echo "✅ Worker deployed"
  environment:
    name: production/worker