# ─────────────────────────────────────────────────────────────────
# QAI Backend — GitLab CI/CD (Azure) — self-hosted ARM runner
#
# Одна Docker image (amd64) → деплой двух Container Apps:
#   • qai-api-prod
#   • qai-worker-prod
# Образ в ACR; Container Apps тянут через Managed Identity.
#
# Раннер: dev-runner (Azure VM, ARM64, docker executor + host docker.sock).
# Container Apps бегут amd64, VM — arm64 → образ собирается через buildx
# (driver docker-container) под qemu. binfmt amd64 должен быть на VM:
#   docker run --privileged --rm tonistiigi/binfmt --install amd64
#
# Required CI/CD Variables (Group: qait.dev):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   RESOURCE_GROUP=qai-prod-rg  ACR_NAME=qaiprodacrc3f4ef
#   ACR_LOGIN_SERVER=qaiprodacrc3f4ef.azurecr.io
#   CONTAINER_APP_API=qai-api-prod  CONTAINER_APP_WORKER=qai-worker-prod
# ─────────────────────────────────────────────────────────────────

default:
  tags:
    - dev-runner-appex      # все джобы → наш self-hosted runner

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    # MR-пайплайн: собирается только supply-chain проверка lock-файла ниже.
    # Остальные джобы завязаны на $CI_COMMIT_BRANCH, который в MR-пайплайне
    # пуст, поэтому здесь ничего не собирается и не деплоится.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

variables:
  IMAGE: "${ACR_LOGIN_SERVER}/qai-backend:${CI_COMMIT_SHORT_SHA}"
  IMAGE_LATEST: "${ACR_LOGIN_SERVER}/qai-backend:latest"

stages:
  - check
  - build
  - deploy

# ─────────────────────────────────────────────────────────────────
# Supply-chain: lock-файл не меняется в одиночку
#
# Заражённая версия зависимости приезжает в проект через изменение
# lock-файла — часто вообще без единой строки в package.json, если это
# транзитивная зависимость. Джоба падает, когда в MR изменён lock, а
# манифест нет: это заставляет посмотреть глазами ровно на тот дифф,
# который и есть вектор атаки.
# ─────────────────────────────────────────────────────────────────
lockfile:review:
  stage: check
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git >/dev/null
  script:
    - |
      set -eu
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then
        echo "ℹ️  нет CI_MERGE_REQUEST_DIFF_BASE_SHA — пропускаем"
        exit 0
      fi
      CHANGED="$(git diff --name-only "$BASE" HEAD)"
      echo "── изменённые файлы ──"
      printf '%s\n' "$CHANGED" | sed 's/^/  /'
      LOCK="$(printf '%s\n' "$CHANGED" | grep -cE '(^|/)package-lock\.json$' || true)"
      MANIFEST="$(printf '%s\n' "$CHANGED" | grep -cE '(^|/)package\.json$' || true)"
      if [ "$LOCK" -gt 0 ] && [ "$MANIFEST" -eq 0 ]; then
        echo
        echo "❌ package-lock.json изменён, а package.json — нет."
        echo "   Так выглядит и безобидный refresh lock-файла, и подмена версии"
        echo "   транзитивной зависимости. Посмотрите дифф глазами:"
        echo "     git diff $BASE HEAD -- '*package-lock.json'"
        echo "   Если изменение намеренное — опишите его в описании MR и"
        echo "   отразите в package.json, либо запустите джобу вручную."
        exit 1
      fi
      echo "✅ lock-файл в одиночку не менялся"

# ─────────────────────────────────────────────────────────────────
# Тесты — блокирующий гейт MR
#
# Последний из четырёх репозиториев, который получает гейт. Именно здесь
# красная база пролежала с июля: в стадии check жил только lockfile:review,
# «держать зелёным» было нечем. Теперь MR не мёржится, пока unit-lane красный.
#
# Гоняется ТОЛЬКО unit-полоса (`npm test` = `jest --selectProjects unit`).
# Вторая полоса — 13 файлов, которым нужен настоящий браузер или Redis, —
# в гейт НЕ входит: они медленные и под нагрузкой падают таймаутами, которые
# неотличимы от настоящих зависаний. Их запускают отдельно:
# `npm run test:integration`. Раскладка полос — в jest.config.js.
#
# --runInBand намеренно: гейт не должен флапать. Полоса проходит за ~106с
# последовательно, и параллельные воркеры на общем раннере — ровно тот
# источник ложных таймаутов, из-за которого 15 падений однажды приняли за
# сломанные тесты.
#
# --forceExit ВЫНУЖДЕННО. Полоса зелёная (531/531, 7366 тестов, ~97с), но
# jest после неё не выходит сам: «Jest did not exit one second after the test
# run has completed». Фикс queues.ts (не открывать Redis-сокеты под
# NODE_ENV=test) убрал тысячи ECONNREFUSED и ускорил прогон в 2.5 раза, но
# утечку хендлов не закрыл до конца — источник ещё не найден.
#
# Без флага джоба висит до таймаута раннера, а зависшая джоба это не «зелено»,
# это ничто. С флагом гейт ловит все падения ассертов — ровно ту гниль, из-за
# которой база лежала красной с июля, — но НОВУЮ утечку хендлов уже не покажет.
# Это осознанный размен, а не недосмотр.
#
# Флаг снять, когда найдётся остаток утечки:
# .claude/deferred/20260815-importing-queues-opens-72-redis-sockets.md
# ─────────────────────────────────────────────────────────────────
test:
  stage: check
  image: node:20-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    key:
      files:
        - package-lock.json
    paths:
      # Кэшируем npm-кэш, а не node_modules: `npm ci` всё равно сносит дерево,
      # а на self-hosted раннере именно кэш переживает джобы.
      - .npm/
  script:
    - echo "📦 Installing backend dependencies..."
    # --ignore-scripts дублирует .npmrc намеренно: флаг должен быть виден
    # в самой команде. Прод здесь всегда ставился именно так.
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund --ignore-scripts
    - echo "🧪 Running the unit lane..."
    # Без JUnit-отчёта: у jest нет встроенного репортера, а тащить jest-junit
    # ради оформления — это лишняя зависимость в дереве (см.
    # ../.claude/rules/supply-chain.md). Падения видно в логе джобы;
    # виджет MR можно добавить отдельно, если он реально понадобится.
    - npm test -- --runInBand --ci --forceExit

# ─────────────────────────────────────────────────────────────────
# Azure OIDC Federated Identity (работает и на self-hosted runner)
# ─────────────────────────────────────────────────────────────────
.azure_auth: &azure_auth
  id_tokens:
    AZURE_TOKEN:
      aud: https://gitlab.com
  before_script:
    - |
      set -euo pipefail
      az login \
        --federated-token "$AZURE_TOKEN" \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --output none
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"

# ─────────────────────────────────────────────────────────────────
# Сборка образа (amd64 через buildx/qemu) и push в ACR — host docker
# ─────────────────────────────────────────────────────────────────
build:
  stage: build
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *azure_auth
  script:
    - |
      set -euo pipefail

      echo "🐳 docker CLI + buildx"
      tdnf install -y moby-cli ca-certificates curl tar
      tdnf clean all
      mkdir -p ~/.docker/cli-plugins
      curl -fsSL https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-arm64 \
        -o ~/.docker/cli-plugins/docker-buildx
      chmod +x ~/.docker/cli-plugins/docker-buildx
      docker buildx version

      echo "🔌 host Docker via mounted socket"
      docker info >/dev/null

      echo "🔐 Login to ACR"
      az acr login --name "$ACR_NAME"

      echo "🏗️ buildx builder (docker-container, amd64 via qemu)"
      docker buildx create --name qaibuilder --driver docker-container --use 2>/dev/null || docker buildx use qaibuilder
      docker buildx inspect --bootstrap

      echo "🔨 build & push (linux/amd64): $IMAGE"
      docker buildx build \
        --platform linux/amd64 \
        --cache-from type=registry,ref="$IMAGE_LATEST" \
        --cache-to type=inline \
        --tag "$IMAGE" \
        --tag "$IMAGE_LATEST" \
        --push \
        .

# ─────────────────────────────────────────────────────────────────
# Деплой API
# ─────────────────────────────────────────────────────────────────
deploy:api:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying API → $CONTAINER_APP_API"
      az containerapp update \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none
      URL=$(az containerapp show \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --query "properties.configuration.ingress.fqdn" -o tsv)
      echo "✅ API deployed → https://$URL"
  environment:
    name: production/api
    url: https://api.qait.dev

# ─────────────────────────────────────────────────────────────────
# Деплой Worker (command/args заданы в Terraform — CI меняет только image)
# ─────────────────────────────────────────────────────────────────
deploy:worker:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying Worker → $CONTAINER_APP_WORKER"
      az containerapp update \
        --name "$CONTAINER_APP_WORKER" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none
      echo "✅ Worker deployed"
  environment:
    name: production/worker