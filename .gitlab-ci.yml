# ─────────────────────────────────────────────────────────────────
# QAI Backend — GitLab CI/CD (Azure)
#
# Одна Docker image → деплой двух Container Apps:
#   • qai-api-prod    — CMD: node -r tsconfig-paths/register dist/index.js
#   • qai-worker-prod — CMD: node ... + HTTP health server на 8080
#
# Образ хранится в Azure Container Registry (ACR). Container Apps тянут
# через Managed Identity (без паролей).
#
# Required CI/CD Variables (Group: qait.dev):
#   AZURE_CLIENT_ID       — terraform output gitlab_runner_client_id
#   AZURE_TENANT_ID       — terraform output azure_tenant_id
#   AZURE_SUBSCRIPTION_ID — terraform output azure_subscription_id
#   RESOURCE_GROUP        — qai-prod-rg
#   ACR_NAME              — qaiprodacr24d6d7
#   ACR_LOGIN_SERVER      — qaiprodacr24d6d7.azurecr.io
#   CONTAINER_APP_API     — qai-api-prod
#   CONTAINER_APP_WORKER  — qai-worker-prod
# ─────────────────────────────────────────────────────────────────

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_BUILDKIT: "0"

  IMAGE: "${ACR_LOGIN_SERVER}/qai-backend:${CI_COMMIT_SHORT_SHA}"
  IMAGE_LATEST: "${ACR_LOGIN_SERVER}/qai-backend:latest"

stages:
  - build
  - deploy

# ─────────────────────────────────────────────────────────────────
# Шаблон: авторизация в Azure через OIDC Federated Identity
# ─────────────────────────────────────────────────────────────────
.azure_auth: &azure_auth
  id_tokens:
    AZURE_TOKEN:
      aud: https://gitlab.com
  before_script:
    - |
      set -euo pipefail

      az login \
        --federated-token "$AZURE_TOKEN" \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --output none

      az account set --subscription "$AZURE_SUBSCRIPTION_ID"

# ─────────────────────────────────────────────────────────────────
# Сборка Docker образа и push в ACR
# ─────────────────────────────────────────────────────────────────
build:
  stage: build
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  services:
    - name: docker:26-dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *azure_auth
  script:
    - |
      set -euo pipefail

      echo "🐳 Installing Docker CLI"
      tdnf install -y moby-cli ca-certificates
      tdnf clean all

      echo "⏳ Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 2
      done

      docker info >/dev/null

      echo "🔐 Login to ACR"
      az acr login --name "$ACR_NAME"

      echo "🔨 Building image:"
      echo "$IMAGE"

      docker pull "$IMAGE_LATEST" 2>/dev/null || true

      docker build \
        --cache-from "$IMAGE_LATEST" \
        --tag "$IMAGE" \
        --tag "$IMAGE_LATEST" \
        .

      echo "⬆️ Pushing to ACR..."
      docker push "$IMAGE"
      docker push "$IMAGE_LATEST"

# ─────────────────────────────────────────────────────────────────
# Деплой API — Azure Container App
# ─────────────────────────────────────────────────────────────────
deploy:api:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail

      echo "🚀 Deploying API → $CONTAINER_APP_API"

      az containerapp update \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none

      URL=$(az containerapp show \
        --name "$CONTAINER_APP_API" \
        --resource-group "$RESOURCE_GROUP" \
        --query "properties.configuration.ingress.fqdn" \
        -o tsv)

      echo "✅ API deployed → https://$URL"
  environment:
    name: production/api
    url: https://api.qait.dev

# ─────────────────────────────────────────────────────────────────
# Деплой Worker — Azure Container App
# command/args заданы в Terraform — CI обновляет только image
# ─────────────────────────────────────────────────────────────────
deploy:worker:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:azurelinux3.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  <<: *azure_auth
  script:
    - |
      set -euo pipefail

      echo "🚀 Deploying Worker → $CONTAINER_APP_WORKER"

      az containerapp update \
        --name "$CONTAINER_APP_WORKER" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$IMAGE" \
        --output none

      echo "✅ Worker deployed"
  environment:
    name: production/worker